name: Gravik Daily Radar

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

concurrency:
  group: gravik-db
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ingest and score
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python -m app.ingest
      - name: Daily Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.digest
      - name: Persist database
        run: |
          git config user.name "gravik-agent"
          git config user.email "actions@users.noreply.github.com"
          git add gravik.db
          git diff --cached --quiet || git commit -m "Update opportunity intelligence database"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
