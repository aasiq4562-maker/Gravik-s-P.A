name: Gravik Telegram Actions

on:
  schedule:
    - cron: "17,47 * * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

concurrency:
  group: gravik-db
  cancel-in-progress: false

jobs:
  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process Telegram buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m app.actions
      - name: Persist action history
        run: |
          git config user.name "gravik-agent"
          git config user.email "actions@users.noreply.github.com"
          git add gravik.db
          git diff --cached --quiet || git commit -m "Record Telegram opportunity actions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
